apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-log-analyzer-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-log-analyzer-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-log-analyzer-binding
subjects:
- kind: ServiceAccount
  name: ai-log-analyzer-sa
  namespace: default
  apiGroup: ""
roleRef:
  kind: ClusterRole
  name: ai-log-analyzer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-log-analyzer
  namespace: default
spec:
  schedule: "*/5 * * * *"  # Run every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ai-log-analyzer-sa
          containers:
          - name: analyzer
            image: arun231998/ai-k8s-log-analyzer:latest
            imagePullPolicy: IfNotPresent
            args: ["--namespace", "default"]
            env:
            # The API key can be supplied via a secret in the cluster
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: gemini-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: openai-api-key
                  optional: true
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
