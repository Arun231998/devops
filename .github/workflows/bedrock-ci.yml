name: AWS Bedrock Log Diagnostics CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-bedrock-log-diagnostics/**'
      - '.github/workflows/bedrock-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-bedrock-log-diagnostics/**'
      - '.github/workflows/bedrock-ci.yml'

jobs:
  validate:
    name: Lint & Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Lint Lambda Handler
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # check syntax errors
        flake8 ai-bedrock-log-diagnostics/lambda/handler.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Terraform Format check
      run: terraform -chdir=ai-bedrock-log-diagnostics/terraform fmt -check

    - name: Terraform Init
      run: terraform -chdir=ai-bedrock-log-diagnostics/terraform init -backend=false

    - name: Terraform Validate
      run: terraform -chdir=ai-bedrock-log-diagnostics/terraform validate
